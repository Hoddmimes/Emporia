// Common settings (Java 21 toolchain, JUnit 5) come from the root build.gradle.
plugins {
    id 'application'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'com.hoddmimes.emporia.simulator.Simulator'
}

run {
    workingDir = projectDir
    args = ['-config', 'simulator.json']
}
