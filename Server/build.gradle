// Common settings (Java 21 toolchain, JUnit 5) come from the root build.gradle.
plugins {
    id 'application'
    id 'war'
    id 'com.gradleup.shadow' version '9.2.2'
}

dependencies {
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'io.javalin.community.ssl:ssl-plugin:6.3.0'
    implementation 'org.mongodb:mongodb-driver-sync:5.1.0'
    // The alternative database (database type "sqlite", db.SqliteDatabase); bundles the native library
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'
    // The web application's /ws endpoint (webapp.BdxWebSocket); Tomcat provides it at run time
    compileOnly 'jakarta.websocket:jakarta.websocket-api:2.0.0'
}

application {
    mainClass = 'com.hoddmimes.emporia.server.Server'
}

run {
    workingDir = projectDir
    args = ['-config', 'emporia.json']
    // Same logging configuration as the IntelliJ run configuration
    jvmArgs = ["-Dlog4j2.configurationFile=${file('log4j2.xml')}"]
}

// ── Build version and date ────────────────────────────────────────────────
// The version is V<version>-<build>, from version.properties: version is the main version (changed by
// hand), build a number that each Gradle run building the WAR or the fat jar increases by one (so a
// "./gradlew build", which makes both, counts once). emporia-build.properties on the classpath (read by
// BuildInfo, shown on the login pages and logged at startup) holds the version and the time of the build;
// the date changes on every build, so generateBuildInfo always runs.
def versionFile  = file('version.properties')
def buildInfoDir = layout.buildDirectory.dir('generated/buildinfo')

def readVersion = {
    def tProps = new Properties()
    versionFile.withInputStream { tProps.load(it) }
    tProps
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':Server:war') || graph.hasTask(':Server:shadowJar')) {
        def tProps = readVersion()
        int tBuild = (tProps.getProperty('build') as int) + 1
        // Rewrite only the build line, so the comments stay
        versionFile.text = versionFile.text.replaceFirst(/(?m)^build=.*$/, "build=${tBuild}")
        logger.lifecycle("Emporia build number ${String.format('%03d', tBuild)}")
    }
}

tasks.register('generateBuildInfo') {
    outputs.dir buildInfoDir
    outputs.upToDateWhen { false }
    doLast {
        def tProps   = readVersion()
        def tVersion = "V${tProps.getProperty('version')}-${String.format('%03d', tProps.getProperty('build') as int)}"
        def tFile = buildInfoDir.get().file('emporia-build.properties').asFile
        tFile.parentFile.mkdirs()
        tFile.text = "version=${tVersion}\nbuildDate=${new Date().format('yyyy-MM-dd HH:mm')}\n"
    }
}

sourceSets.main.resources.srcDir(files(buildInfoDir).builtBy('generateBuildInfo'))

// ── Fat jar ───────────────────────────────────────────────────────────────
// build/libs/Server-<version>-all.jar: the server and all its libraries in one jar, run with
//   java -jar Server-<version>-all.jar -config emporia.json [-mode test]
// The service files of the libraries (META-INF/services, used by Jetty and Log4j) are merged.
shadowJar {
    mergeServiceFiles()
    manifest { attributes 'Main-Class': application.mainClass.get() }
}

// ── WAR for Tomcat ────────────────────────────────────────────────────────
// build/libs/emporia.war, for Tomcat 10.1 or later (Jakarta EE), deployed at /emporia (webapps/emporia.war;
// the pages use relative paths, so any context path works). The configuration file is given with the
// context parameter or system property emporia.config, or EMPORIA_CONFIG (webapp.EmporiaWebApp).
// The pages (WebContent) are at the root of the WAR; Tomcat provides the servlet and WebSocket APIs. The
// WAR has its own log4j2.xml (src/war/resources: logs to Tomcat's logs/emporia.log).
def warResources = layout.buildDirectory.dir('war-resources')

tasks.register('warResources', Sync) {
    from(processResources) { exclude 'log4j2.xml' }
    from 'src/war/resources'
    into warResources
}

war {
    archiveFileName = 'emporia.war'
    from 'WebContent'
    webInf { from 'src/war/WEB-INF' }
    def tMainResources = sourceSets.main.output.resourcesDir
    classpath = classpath.filter { it != tMainResources && !it.name.startsWith('jetty-jakarta-servlet-api') } +
                files(warResources).builtBy('warResources')
}

// ── Linux installer ───────────────────────────────────────────────────────
// build/dist/emporia-<version>-<build>.run: src/installer/install.sh followed by a tar.gz of the fat jar
// (as emporia.jar), WebContent, log4j2.xml, README.txt (the service commands etc.) and uninstall.sh. Run as root (sudo bash emporia-....run):
// installs the server in a directory (asked for, default /opt/emporia) and runs it as the systemd service
// emporia; an upgrade keeps the configuration, the database and the PEM files. Java 21+ must be installed.
// It builds the fat jar, so it increases the build number.
def installerDir = layout.buildDirectory.dir('installer')

tasks.register('installerPayload', Tar) {
    archiveFileName = 'payload.tar.gz'
    destinationDirectory = installerDir
    compression = Compression.GZIP
    // Real file times, so the web server's Last-Modified of an upgraded page changes (browser caches)
    preserveFileTimestamps = true
    from(shadowJar) { rename { 'emporia.jar' } }
    from('WebContent') { into 'WebContent' }
    from 'log4j2.xml'
    from 'src/installer/README.txt'
    from('src/installer/uninstall.sh') { filePermissions { unix('rwxr-xr-x') } }
}

tasks.register('installer') {
    group = 'distribution'
    description = 'Builds the Linux installer build/dist/emporia-<version>-<build>.run'
    dependsOn 'installerPayload'
    def tHeader  = file('src/installer/install.sh')
    def tPayload = installerDir.map { it.file('payload.tar.gz') }
    def tDistDir = layout.buildDirectory.dir('dist')
    inputs.file tHeader
    inputs.file tPayload
    outputs.dir tDistDir
    doLast {
        def tProps   = readVersion()
        def tVersion = "${tProps.getProperty('version')}-${String.format('%03d', tProps.getProperty('build') as int)}"
        byte[] tArchive = tPayload.get().asFile.bytes
        def tSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(tArchive).encodeHex().toString()
        def tScript = tHeader.text.replace('@VERSION@', tVersion).replace('@SHA256@', tSha256)
        def tDir = tDistDir.get().asFile
        tDir.mkdirs()
        tDir.listFiles().findAll { it.name.endsWith('.run') }.each { it.delete() }
        def tOut = new File(tDir, "emporia-${tVersion}.run")
        tOut.withOutputStream { it.write(tScript.getBytes('UTF-8')); it.write(tArchive) }
        tOut.setExecutable(true, false)
        logger.lifecycle("Installer ${tOut}")
    }
}
