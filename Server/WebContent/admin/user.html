<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; User</title>
    <link rel="stylesheet" href="css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2 id="page-title">User</h2>
                <a href="users.html" class="btn btn-outline btn-sm">&larr; Back to Users</a>
            </div>

            <div id="error-banner" class="alert alert-error alert-hidden"></div>

            <div class="card">
                <div class="card-header">
                    <h3>User Details</h3>
                    <button class="btn btn-danger btn-sm" onclick="showDeleteModal()">Delete User</button>
                </div>

                <div class="detail-grid">
                    <div class="detail-row">
                        <span class="detail-label">ID</span>
                        <span class="detail-value" id="d-id"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Firm</span>
                        <span class="detail-value">
                            <select id="d-firm" class="field-input" onchange="checkChanged()">
                                <option value="">— select firm —</option>
                            </select>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Name</span>
                        <span class="detail-value">
                            <input type="text" id="d-name" class="field-input" oninput="checkChanged()">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Mail</span>
                        <span class="detail-value">
                            <input type="email" id="d-mail" class="field-input" oninput="checkChanged()">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value">
                            <input type="text" id="d-phone" class="field-input" oninput="checkChanged()">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Password hash</span>
                        <span class="detail-value" id="d-password-hash"
                              style="font-family:monospace;font-size:11px;word-break:break-all;color:var(--text-light);">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">New password</span>
                        <span class="detail-value">
                            <input type="password" id="d-password-new" class="field-input"
                                   placeholder="Leave blank to keep current password"
                                   oninput="checkChanged()">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">
                            <select id="d-status" class="field-input" style="max-width:180px;" onchange="checkChanged()">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="SUSPENDED">SUSPENDED</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </span>
                    </div>
                </div>

                <div style="margin-top:20px;">
                    <button id="save-btn" class="btn btn-primary" onclick="saveUser()" disabled>
                        Save Changes
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete confirmation modal -->
    <div id="delete-modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>Delete User</h3>
            <p>Are you sure you want to delete user <strong id="modal-user-id"></strong>?
               This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/cd-session.js"></script>
    <script src="js/cd-api.js"></script>
    <script src="js/cd-nav.js"></script>
    <script>
        cdNav.render('list-users');
        cdSession.guard('user-info');

        const mongoId = new URLSearchParams(window.location.search).get('id');
        let originalValues = {};

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.textContent = msg;
            el.classList.remove('alert-hidden');
        }

        function checkChanged() {
            const changed =
                document.getElementById('d-firm').value         !== originalValues.firm   ||
                document.getElementById('d-name').value         !== originalValues.name   ||
                document.getElementById('d-mail').value         !== originalValues.mail   ||
                document.getElementById('d-phone').value        !== originalValues.phone  ||
                document.getElementById('d-status').value       !== originalValues.status ||
                document.getElementById('d-password-new').value !== '';
            document.getElementById('save-btn').disabled = !changed;
        }

        async function loadFirms(selectedFirm) {
            const r = await cdApi.request('../api/admin/firms');
            if (!r.ok) { showError('Failed to load firms: ' + r.error); return; }
            const firms = r.data;
            const select = document.getElementById('d-firm');
            firms.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.name;
                opt.textContent = f.name;
                if (f.name === selectedFirm) opt.selected = true;
                select.appendChild(opt);
            });
        }

        async function loadUser() {
            if (!mongoId) { window.location.href = 'users.html'; return; }
            try {
                const r = await cdApi.request(`../api/admin/users/${mongoId}`);
                if (r.status === 404) { window.location.href = 'users.html'; return; }
                if (!r.ok) { showError('Failed to load user: ' + r.error); return; }
                const u = r.data;

                document.getElementById('page-title').textContent = u.id;
                document.getElementById('d-id').textContent       = u.id;
                document.getElementById('d-name').value           = u.name   || '';
                document.getElementById('d-mail').value           = u.mail   || '';
                document.getElementById('d-phone').value          = u.phone  || '';
                document.getElementById('d-status').value          = u.status;
                document.getElementById('d-password-hash').textContent = u.password || '(not set)';

                await loadFirms(u.firm);

                originalValues = {
                    firm:   u.firm   || '',
                    name:   u.name   || '',
                    mail:   u.mail   || '',
                    phone:  u.phone  || '',
                    status: u.status
                };
            } catch (e) {
                showError('Unexpected error: ' + e.message);
            }
        }

        async function saveUser() {
            document.getElementById('error-banner').classList.add('alert-hidden');
            const newPassword = document.getElementById('d-password-new').value;
            const body = {
                firm:   document.getElementById('d-firm').value,
                name:   document.getElementById('d-name').value.trim(),
                mail:   document.getElementById('d-mail').value.trim(),
                phone:  document.getElementById('d-phone').value.trim(),
                status: document.getElementById('d-status').value
            };
            if (newPassword !== '') {
                body.password = newPassword;
            }
            try {
                const r = await cdApi.request(`../api/admin/users/${mongoId}`, cdApi.json('PATCH', body));
                if (!r.ok) { showError('Failed to save changes: ' + r.error); return; }

                originalValues = { ...body };
                document.getElementById('d-password-new').value = '';
                // Refresh hash display if password was changed
                if (newPassword !== '') {
                    const refreshed = await cdApi.request(`../api/admin/users/${mongoId}`);
                    if (refreshed.ok) {
                        const u = refreshed.data;
                        document.getElementById('d-password-hash').textContent = u.password || '(not set)';
                    }
                }
                const btn = document.getElementById('save-btn');
                btn.disabled = true;
                btn.textContent = 'Saved';
                setTimeout(() => { btn.textContent = 'Save Changes'; }, 1500);
            } catch (e) {
                showError('Unexpected error: ' + e.message);
            }
        }

        function showDeleteModal() {
            document.getElementById('modal-user-id').textContent =
                document.getElementById('d-id').textContent;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').style.display = 'none';
        }

        async function confirmDelete() {
            closeDeleteModal();
            try {
                const r = await cdApi.request(`../api/admin/users/${mongoId}`, { method: 'DELETE' });
                if (!r.ok) { showError('Failed to delete user: ' + r.error); return; }
                window.location.href = 'users.html';
            } catch (e) {
                showError('Unexpected error: ' + e.message);
            }
        }

        loadUser();
    </script>
</body>
</html>
