<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Administration</title>
    <link rel="stylesheet" href="css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <h2>Dashboard</h2>
            <div class="card">
                <p>Welcome to the Emporia Common Data administration interface.
                   Use the navigation on the left to manage business data and system configuration.</p>
            </div>
            <div class="card" style="max-width:720px;">
                <div class="card-header"><h3>Latest system messages</h3>
                    <a href="system-messages.html" class="btn btn-outline btn-sm">Send a System Message</a></div>
                <div id="sysmsg-list" class="sysmsg-list">Loading&hellip;</div>
            </div>
        </main>
    </div>

    <script src="js/cd-session.js"></script>
    <script src="js/cd-api.js"></script>
    <script src="js/cd-nav.js"></script>
    <script src="js/cd-sysmsg.js"></script>
    <script>
        cdNav.render('dashboard');
        cdSession.guard('user-info');

        // The latest system messages (sent to all trading users from System Messages)
        (async () => {
            const r = await cdSysMsg.load();
            const el = document.getElementById('sysmsg-list');
            if (r.status === 401) return;   // cdSession.guard goes to the login page
            if (!r.ok) { el.textContent = 'Failed to load the system messages: ' + r.error; return; }
            cdSysMsg.render(el, r.data.messages);
        })();
    </script>
</body>
</html>
