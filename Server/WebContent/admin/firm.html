<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Firm</title>
    <link rel="stylesheet" href="/admin/css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2 id="page-title">Firm</h2>
                <a href="/admin/firms.html" class="btn btn-outline btn-sm">&larr; Back to Firms</a>
            </div>

            <div id="error-banner" class="alert alert-error alert-hidden"></div>

            <div class="card" id="firm-card">
                <div class="card-header">
                    <h3>Firm Details</h3>
                    <button class="btn btn-danger btn-sm" onclick="showDeleteModal()">Delete Firm</button>
                </div>

                <div class="detail-grid">
                    <div class="detail-row">
                        <span class="detail-label">Name</span>
                        <span class="detail-value" id="d-name"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">
                            <select id="d-status" class="field-input" style="max-width:180px;" onchange="checkChanged()">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="SUSPENDED">SUSPENDED</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Address</span>
                        <span class="detail-value">
                            <input type="text" id="d-address" class="field-input" oninput="checkChanged()">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value">
                            <input type="text" id="d-phone" class="field-input" oninput="checkChanged()">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Contact</span>
                        <span class="detail-value">
                            <input type="text" id="d-contact" class="field-input" oninput="checkChanged()">
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Mail</span>
                        <span class="detail-value">
                            <input type="email" id="d-mail" class="field-input" oninput="checkChanged()">
                        </span>
                    </div>
                </div>

                <div style="margin-top:20px;">
                    <button id="save-btn" class="btn btn-primary" onclick="saveFirm()" disabled>
                        Save Changes
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete confirmation modal -->
    <div id="delete-modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>Delete Firm</h3>
            <p>Are you sure you want to delete <strong id="modal-firm-name"></strong>?
               This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="/admin/js/cd-session.js"></script>
    <script src="/admin/js/cd-nav.js"></script>
    <script>
        cdNav.render('list-firms');
        cdSession.guard('user-info');

        const firmId = new URLSearchParams(window.location.search).get('id');
        let originalValues = {};

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.textContent = msg;
            el.classList.remove('alert-hidden');
        }

        function checkChanged() {
            const changed =
                document.getElementById('d-status').value  !== originalValues.status  ||
                document.getElementById('d-address').value !== originalValues.address ||
                document.getElementById('d-phone').value   !== originalValues.phone   ||
                document.getElementById('d-contact').value !== originalValues.contact ||
                document.getElementById('d-mail').value    !== originalValues.mail;
            document.getElementById('save-btn').disabled = !changed;
        }

        async function loadFirm() {
            if (!firmId) { window.location.href = '/admin/firms.html'; return; }
            try {
                const response = await fetch(`/api/admin/firms/${firmId}`);
                if (response.status === 404) { window.location.href = '/admin/firms.html'; return; }
                if (!response.ok) { showError('Failed to load firm.'); return; }
                const f = await response.json();

                document.getElementById('page-title').textContent = f.name;
                document.getElementById('d-name').textContent     = f.name;
                document.getElementById('d-status').value         = f.status;
                document.getElementById('d-address').value        = f.address || '';
                document.getElementById('d-phone').value          = f.phone   || '';
                document.getElementById('d-contact').value        = f.contact || '';
                document.getElementById('d-mail').value           = f.mail    || '';

                originalValues = {
                    status:  f.status,
                    address: f.address || '',
                    phone:   f.phone   || '',
                    contact: f.contact || '',
                    mail:    f.mail    || ''
                };
            } catch (e) {
                showError('Connection error.');
            }
        }

        async function saveFirm() {
            document.getElementById('error-banner').classList.add('alert-hidden');
            const body = {
                status:  document.getElementById('d-status').value,
                address: document.getElementById('d-address').value.trim(),
                phone:   document.getElementById('d-phone').value.trim(),
                contact: document.getElementById('d-contact').value.trim(),
                mail:    document.getElementById('d-mail').value.trim()
            };
            try {
                const response = await fetch(`/api/admin/firms/${firmId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!response.ok) { showError('Failed to save changes.'); return; }

                originalValues = { ...body };
                const btn = document.getElementById('save-btn');
                btn.disabled = true;
                btn.textContent = 'Saved';
                setTimeout(() => { btn.textContent = 'Save Changes'; }, 1500);
            } catch (e) {
                showError('Connection error.');
            }
        }

        function showDeleteModal() {
            document.getElementById('modal-firm-name').textContent =
                document.getElementById('d-name').textContent;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').style.display = 'none';
        }

        async function confirmDelete() {
            closeDeleteModal();
            try {
                const response = await fetch(`/api/admin/firms/${firmId}`, { method: 'DELETE' });
                if (!response.ok) { showError('Failed to delete firm.'); return; }
                window.location.href = '/admin/firms.html';
            } catch (e) {
                showError('Connection error.');
            }
        }

        loadFirm();
    </script>
</body>
</html>
