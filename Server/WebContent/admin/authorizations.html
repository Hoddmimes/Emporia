<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Authorizations</title>
    <link rel="stylesheet" href="/admin/css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2>Authorizations</h2>
                <a href="/admin/create-authorization.html" class="btn btn-primary btn-sm">+ Create Authorization</a>
            </div>

            <div id="error-banner" class="alert alert-error alert-hidden"></div>

            <div class="card" style="margin-bottom:16px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label for="firm-select">Firm</label>
                    <select id="firm-select" onchange="loadAuthorizations()"
                            style="width:100%;max-width:320px;padding:10px 13px;border:1px solid var(--border);border-radius:4px;font-size:14px;color:var(--text);outline:none;">
                        <option value="">— select firm —</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <table class="data-table" id="auth-table">
                    <thead>
                        <tr>
                            <th>Market</th>
                            <th style="width:100px;"></th>
                        </tr>
                    </thead>
                    <tbody id="auth-body">
                        <tr><td colspan="2" class="empty-state">Select a firm to view authorizations.</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Delete confirmation modal -->
    <div id="delete-modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>Delete Authorization</h3>
            <p>Remove authorization for firm <strong id="modal-firm"></strong> on market <strong id="modal-market"></strong>?
               This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger"  onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="/admin/js/cd-session.js"></script>
    <script src="/admin/js/cd-api.js"></script>
    <script src="/admin/js/cd-nav.js"></script>
    <script>
        cdNav.render('list-authorizations');
        cdSession.guard('user-info');

        let pendingDeleteId = null;
        const marketNameById = new Map();

        async function loadMarkets() {
            try {
                const [rm, rb] = await Promise.all(
                    ['/api/admin/markets', '/api/admin/bulletin-markets'].map(url => cdApi.request(url)));
                const failed = [rm, rb].find(r => !r.ok);
                if (failed) { cdApi.showError('error-banner', 'Failed to load markets: ' + failed.error); return; }
                const [markets, bulletinMarkets] = [rm.data, rb.data];
                bulletinMarkets.forEach(m => markets.push({ ...m, name: m.name + ' (bulletin)' }));
                markets.forEach(m => marketNameById.set(String(m.id), m.name));
            } catch (e) { /* ignore */ }
        }

        function marketLabel(id) {
            if (id === '*') return '<em>* (all markets)</em>';
            const name = marketNameById.get(String(id));
            return name ? `${escHtml(name)} <span style="color:var(--text-light);">(${escHtml(id)})</span>` : escHtml(id);
        }

        async function loadFirms() {
            try {
                const r = await cdApi.request('/api/admin/firms');
                if (!r.ok) { cdApi.showError('error-banner', 'Failed to load firms: ' + r.error); return; }
                const firms = r.data;
                const select = document.getElementById('firm-select');
                firms.sort((a, b) => a.name.localeCompare(b.name)).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.name;
                    opt.textContent = f.name;
                    select.appendChild(opt);
                });
            } catch (e) { /* ignore */ }
        }

        async function loadAuthorizations() {
            const firm = document.getElementById('firm-select').value;
            const tbody = document.getElementById('auth-body');
            if (!firm) {
                tbody.innerHTML = '<tr><td colspan="2" class="empty-state">Select a firm to view authorizations.</td></tr>';
                return;
            }
            try {
                const r = await cdApi.request(`/api/admin/authorizations?firm=${encodeURIComponent(firm)}`);
                if (!r.ok) {
                    tbody.innerHTML = '<tr><td colspan="2" class="empty-state">Failed to load authorizations.</td></tr>';
                    cdApi.showError('error-banner', 'Failed to load authorizations: ' + r.error);
                    return;
                }
                const auths = r.data;
                if (auths.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" class="empty-state">No authorizations found for this firm.</td></tr>';
                    return;
                }
                tbody.innerHTML = auths.map(a => `
                    <tr>
                        <td>${marketLabel(a.market)}</td>
                        <td style="text-align:right;">
                            <button class="btn btn-danger btn-sm"
                                    onclick="showDeleteModal('${a.mongoId}','${escHtml(a.firm)}','${escHtml(a.market)}')">
                                Delete
                            </button>
                        </td>
                    </tr>`).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="2" class="empty-state">Failed to load authorizations.</td></tr>';
                cdApi.showError('error-banner', 'Unexpected error: ' + e.message);
            }
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
        }

        function showDeleteModal(id, firm, market) {
            pendingDeleteId = id;
            document.getElementById('modal-firm').textContent   = firm;
            const name = market === '*'
                ? '* (all markets)'
                : (marketNameById.get(String(market)) ? `${marketNameById.get(String(market))} (${market})` : market);
            document.getElementById('modal-market').textContent = name;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').style.display = 'none';
            pendingDeleteId = null;
        }

        async function confirmDelete() {
            if (!pendingDeleteId) return;
            const idToDelete = pendingDeleteId;
            closeDeleteModal();
            const r = await cdApi.request(`/api/admin/authorizations/${idToDelete}`, { method: 'DELETE' });
            if (!r.ok) { cdApi.showError('error-banner', 'Failed to delete authorization: ' + r.error); return; }
            loadAuthorizations();
        }

        loadMarkets().then(loadFirms);
    </script>
</body>
</html>
