<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Users</title>
    <link rel="stylesheet" href="/admin/css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2>Users</h2>
                <a href="/admin/create-user.html" class="btn btn-primary btn-sm">+ Create User</a>
            </div>

            <div class="card" style="padding:0; overflow:hidden;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Firm</th>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="users-body">
                        <tr class="empty-row"><td colspan="4">Loading&hellip;</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/admin/js/cd-session.js"></script>
    <script src="/admin/js/cd-nav.js"></script>
    <script>
        cdNav.render('list-users');
        cdSession.guard('user-info');

        function statusBadge(status) {
            const cls = { ACTIVE: 'badge-active', SUSPENDED: 'badge-suspended', INACTIVE: 'badge-inactive' }[status] || 'badge-inactive';
            return `<span class="badge ${cls}">${status || ''}</span>`;
        }

        function escHtml(s) {
            return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                if (!response.ok) { window.location.href = '/admin/login.html'; return; }
                const users = (await response.json()).sort((a, b) => {
                    const firmCmp = (a.firm || '').localeCompare(b.firm || '');
                    return firmCmp !== 0 ? firmCmp : (a.id || '').localeCompare(b.id || '');
                });
                const tbody = document.getElementById('users-body');

                if (users.length === 0) {
                    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No users defined yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(u =>
                    `<tr class="row-link" onclick="window.location='/admin/user.html?id=${u.mongoId}'">
                        <td>${escHtml(u.firm)}</td>
                        <td>${escHtml(u.id)}</td>
                        <td>${escHtml(u.name)}</td>
                        <td>${statusBadge(u.status)}</td>
                    </tr>`
                ).join('');
            } catch (e) {
                document.getElementById('users-body').innerHTML =
                    '<tr class="empty-row"><td colspan="3">Failed to load users.</td></tr>';
            }
        }

        loadUsers();
    </script>
</body>
</html>
