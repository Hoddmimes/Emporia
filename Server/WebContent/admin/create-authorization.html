<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Create Authorization</title>
    <link rel="stylesheet" href="/admin/css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2>Create Authorization</h2>
                <a href="/admin/authorizations.html" class="btn btn-outline btn-sm">&larr; Back to Authorizations</a>
            </div>

            <div class="card" style="max-width:480px;">
                <div id="error-msg" class="alert alert-error alert-hidden"></div>
                <form id="create-form" onsubmit="createAuthorization(event)">

                    <div class="form-group">
                        <label for="f-firm">Firm <span style="color:var(--error)">*</span></label>
                        <select id="f-firm" required
                                style="width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:4px;font-size:14px;color:var(--text);outline:none;">
                            <option value="">— select firm —</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="f-market">Market <span style="color:var(--error)">*</span></label>
                        <select id="f-market" required
                                style="width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:4px;font-size:14px;color:var(--text);outline:none;">
                            <option value="">— select market —</option>
                            <option value="*">* (all markets)</option>
                        </select>
                    </div>

                    <div style="display:flex;gap:10px;margin-top:8px;">
                        <button type="submit" class="btn btn-primary">Create Authorization</button>
                        <a href="/admin/authorizations.html" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/admin/js/cd-session.js"></script>
    <script src="/admin/js/cd-nav.js"></script>
    <script>
        cdNav.render('create-authorization');
        cdSession.guard('user-info');

        async function loadFirms() {
            try {
                const response = await fetch('/api/admin/firms');
                if (!response.ok) return;
                const firms = await response.json();
                const select = document.getElementById('f-firm');
                firms.sort((a, b) => a.name.localeCompare(b.name)).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.name;
                    opt.textContent = f.name;
                    select.appendChild(opt);
                });
            } catch (e) { /* ignore */ }
        }

        async function loadMarkets() {
            try {
                const response = await fetch('/api/admin/markets');
                if (!response.ok) return;
                const markets = await response.json();
                const select = document.getElementById('f-market');
                markets.sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.name + (m.description ? ' \u2014 ' + m.description : '');
                    select.appendChild(opt);
                });
            } catch (e) { /* ignore */ }
        }

        async function createAuthorization(event) {
            event.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.classList.add('alert-hidden');

            const body = {
                firm:   document.getElementById('f-firm').value,
                market: document.getElementById('f-market').value
            };

            try {
                const response = await fetch('/api/admin/authorizations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!response.ok) {
                    let errMsg = 'Failed to create authorization. (HTTP ' + response.status + ')';
                    try {
                        const data = await response.json();
                        if (data.error) errMsg = data.error;
                    } catch (_) {}
                    errorMsg.textContent = errMsg;
                    errorMsg.classList.remove('alert-hidden');
                    return;
                }
                window.location.href = '/admin/authorizations.html';
            } catch (e) {
                errorMsg.textContent = 'Connection error: ' + (e.message || String(e));
                errorMsg.classList.remove('alert-hidden');
            }
        }

        loadFirms();
        loadMarkets();
    </script>
</body>
</html>
