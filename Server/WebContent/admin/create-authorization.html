<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Create Authorization</title>
    <link rel="stylesheet" href="css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2>Create Authorization</h2>
                <a href="authorizations.html" class="btn btn-outline btn-sm">&larr; Back to Authorizations</a>
            </div>

            <div class="card" style="max-width:480px;">
                <div id="error-msg" class="alert alert-error alert-hidden"></div>
                <form id="create-form" onsubmit="createAuthorization(event)">

                    <div class="form-group">
                        <label for="f-firm">Firm <span style="color:var(--error)">*</span></label>
                        <select id="f-firm" required
                                style="width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:4px;font-size:14px;color:var(--text);outline:none;">
                            <option value="">— select firm —</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="f-market">Market <span style="color:var(--error)">*</span></label>
                        <select id="f-market" required
                                style="width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:4px;font-size:14px;color:var(--text);outline:none;">
                            <option value="">— select market —</option>
                            <option value="*">* (all markets)</option>
                        </select>
                    </div>

                    <div style="display:flex;gap:10px;margin-top:8px;">
                        <button type="submit" class="btn btn-primary">Create Authorization</button>
                        <a href="authorizations.html" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/cd-session.js"></script>
    <script src="js/cd-api.js"></script>
    <script src="js/cd-nav.js"></script>
    <script>
        cdNav.render('create-authorization');
        cdSession.guard('user-info');

        async function loadFirms() {
            try {
                const r = await cdApi.request('../api/admin/firms');
                if (!r.ok) { cdApi.showError('error-msg', 'Failed to load firms: ' + r.error); return; }
                const firms = r.data;
                const select = document.getElementById('f-firm');
                firms.sort((a, b) => a.name.localeCompare(b.name)).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.name;
                    opt.textContent = f.name;
                    select.appendChild(opt);
                });
            } catch (e) { /* ignore */ }
        }

        async function loadMarkets() {
            try {
                const [rm, rb] = await Promise.all(
                    ['../api/admin/markets', '../api/admin/bulletin-markets'].map(url => cdApi.request(url)));
                const failed = [rm, rb].find(r => !r.ok);
                if (failed) { cdApi.showError('error-msg', 'Failed to load markets: ' + failed.error); return; }
                const [markets, bulletinMarkets] = [rm.data, rb.data];
                bulletinMarkets.forEach(m => markets.push({ ...m, name: m.name + ' (bulletin)' }));
                const select = document.getElementById('f-market');
                markets.sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.name + (m.description ? ' \u2014 ' + m.description : '');
                    select.appendChild(opt);
                });
            } catch (e) { /* ignore */ }
        }

        async function createAuthorization(event) {
            event.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.classList.add('alert-hidden');

            const body = {
                firm:   document.getElementById('f-firm').value,
                market: document.getElementById('f-market').value
            };

            const r = await cdApi.request('../api/admin/authorizations', cdApi.json('POST', body));
            if (!r.ok) {
                errorMsg.textContent = 'Failed to create authorization: ' + r.error;
                errorMsg.classList.remove('alert-hidden');
                return;
            }
            window.location.href = 'authorizations.html';
        }

        loadFirms();
        loadMarkets();
    </script>
</body>
</html>
