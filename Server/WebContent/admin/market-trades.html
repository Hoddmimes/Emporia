<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Market Trades</title>
    <link rel="stylesheet" href="css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2>Market Trades</h2>
            </div>

            <div id="message" class="alert alert-hidden"></div>

            <div class="filter-bar">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" onchange="loadTrades()">
                </div>
                <div class="form-group">
                    <label for="market">Market</label>
                    <select id="market" onchange="loadTrades()">
                        <optgroup label="Order book markets" id="order-markets">
                            <option value="o:0">All order book markets</option>
                        </optgroup>
                        <optgroup label="Bulletin markets" id="bulletin-markets">
                            <option value="b:0">All bulletin markets</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label for="firm">Firm</label>
                    <select id="firm" onchange="loadTrades()">
                        <option value="">All firms</option>
                    </select>
                </div>
                <button class="btn btn-outline btn-sm" onclick="loadTrades()">Refresh</button>
                <button class="btn btn-outline btn-sm" onclick="openExportModal()">Export&hellip;</button>
            </div>

            <div class="filter-info" id="info"></div>

            <div class="card" style="padding:0; overflow-x:auto;">
                <table class="data-table compact">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Market</th>
                            <th>Instrument</th>
                            <th class="num">Price</th>
                            <th class="num">Quantity</th>
                            <th>Buyer</th>
                            <th>Buy Trader</th>
                            <th>Buy Account</th>
                            <th>Seller</th>
                            <th>Sell Trader</th>
                            <th>Sell Account</th>
                            <th>Trade No</th>
                            <th>Reversal</th>
                        </tr>
                    </thead>
                    <tbody id="trades-body">
                        <tr class="empty-row"><td colspan="13">Loading&hellip;</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Export the listed trades to a file -->
    <div id="export-modal" class="modal-overlay" style="display:none;">
        <div class="modal modal-wide">
            <h3>Export Trades</h3>
            <p id="export-what"></p>
            <div class="form-group">
                <label for="export-format">Format</label>
                <select id="export-format" class="field-input" onchange="formatChanged()">
                    <option value="json">JSON</option>
                    <option value="xml">XML</option>
                </select>
            </div>
            <div class="form-group">
                <label for="export-name">File name</label>
                <input type="text" id="export-name" class="field-input" style="max-width:none;">
            </div>
            <p class="form-hint" id="export-hint"></p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeExportModal()">Cancel</button>
                <button class="btn btn-primary" id="export-button" onclick="exportTrades()">Save&hellip;</button>
            </div>
        </div>
    </div>

    <!-- Reverse trade (market supervision) -->
    <div id="reverse-modal" class="modal-overlay" style="display:none;">
        <div class="modal modal-wide">
            <h3 id="reverse-title">Reverse Trade</h3>
            <table class="detail-table" id="reverse-details"></table>
            <p id="reverse-text"></p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="reverse-cancel" onclick="closeReverseModal()">Cancel</button>
                <button class="btn btn-danger" id="reverse-button" onclick="confirmReverse()">Reverse Trade</button>
            </div>
        </div>
    </div>

    <script src="js/cd-session.js"></script>
    <script src="js/cd-api.js"></script>
    <script src="js/cd-nav.js"></script>
    <script>
        cdNav.render('market-trades');
        cdSession.guard('user-info');

        // The market select's values: "o:<marketId>" an order book market, "b:<marketId>" a bulletin market
        // (its bulletin trades), marketId 0 all of that kind
        const SCALE = 100000;
        let trades = [];
        let kind = 'o';            // 'o' or 'b', of the listed trades
        let selected = null;
        let loadSeq = 0;   // only the latest load's reply is shown

        async function init() {
            document.getElementById('date').value = today();
            const [markets, bulletinMarkets, firms] = await Promise.all([
                cdApi.request('../api/admin/markets'),
                cdApi.request('../api/admin/bulletin-markets'),
                cdApi.request('../api/admin/firms')
            ]);
            if ([markets, bulletinMarkets, firms].some(r => r.status === 401)) { window.location.href = 'login.html'; return; }
            for (const [r, what] of [[markets, 'markets'], [bulletinMarkets, 'bulletin markets'], [firms, 'firms']]) {
                if (!r.ok) { showMessage(`Failed to load ${what}: ${r.error}`, true); return; }
            }
            const orderGroup = document.getElementById('order-markets');
            markets.data.sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(m =>
                orderGroup.appendChild(new Option(`${m.name} (${m.type})`, 'o:' + m.id)));
            const bulletinGroup = document.getElementById('bulletin-markets');
            bulletinMarkets.data.sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(m =>
                bulletinGroup.appendChild(new Option(`${m.name} (BULLETIN)`, 'b:' + m.id)));
            const firmSelect = document.getElementById('firm');
            firms.data.sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(f =>
                firmSelect.add(new Option(f.name, f.name)));
            loadTrades();
        }

        async function loadTrades() {
            const date     = document.getElementById('date').value || today();
            const [k, marketId] = document.getElementById('market').value.split(':');
            const firm     = document.getElementById('firm').value;
            const tbody    = document.getElementById('trades-body');
            const seq = ++loadSeq;
            const r = await cdApi.request(`../api/admin/${k === 'b' ? 'bulletin-trades' : 'trades'}?date=${date}&marketId=${marketId}` +
                                          (firm ? `&firm=${encodeURIComponent(firm)}` : ''));
            if (seq !== loadSeq) return;
            if (r.status === 401) { window.location.href = 'login.html'; return; }
            if (!r.ok) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="13">Failed to load trades: ${escHtml(r.error)}</td></tr>`;
                return;
            }
            trades = r.data;
            kind = k;
            const ms = document.getElementById('market');
            exportFilter = { date, kind: k, marketId, marketName: ms.options[ms.selectedIndex].text.replace(/ \(.*\)$/, ''), firm };
            const noun = k === 'b' ? 'bulletin trade' : 'trade';
            setInfo(`${trades.length} ${noun}${trades.length === 1 ? '' : 's'} on ${date}, latest first. Double click a trade to reverse it.`);
            if (trades.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="13">No trades.</td></tr>';
                return;
            }
            tbody.innerHTML = trades.map((t, i) =>
                `<tr class="row-action${t.reversalOf || t.reversedBy ? ' row-muted' : ''}" ondblclick="openReverseModal(${i})">
                    <td title="${escHtml(dateTime(t.tradeTime))}">${escHtml(time(t.tradeTime))}</td>
                    <td>${escHtml(t.marketName)}</td>
                    <td>${escHtml(t.instrumentName)}</td>
                    <td class="num">${price(t.price)}</td>
                    <td class="num">${quantity(t.quantity)}</td>
                    <td class="side-buy">${escHtml(t.buyFirm)}</td>
                    <td>${escHtml(t.buyUser)}</td>
                    <td>${escHtml(t.buyClientAccount)}</td>
                    <td class="side-sell">${escHtml(t.sellFirm)}</td>
                    <td>${escHtml(t.sellUser)}</td>
                    <td>${escHtml(t.sellClientAccount)}</td>
                    <td class="mono">${escHtml(t.tradeNo)}</td>
                    <td>${reversalText(t)}</td>
                </tr>`).join('');
        }

        function reversalText(t) {
            if (t.reversalOf) return `<span class="badge badge-warning badge-id">Reversal of ${escHtml(t.reversalOf)}</span>`;
            if (t.reversedBy) return `<span class="badge badge-inactive badge-id">Reversed by ${escHtml(t.reversedBy)}</span>`;
            return '';
        }

        function openReverseModal(index) {
            selected = trades[index];
            const t = selected;
            const what = `${quantity(t.quantity)} ${t.instrumentName} @ ${price(t.price)}`;
            document.getElementById('reverse-details').innerHTML = rows([
                ['Trade',       `${t.tradeNo}, ${dateTime(t.tradeTime)}`],
                ['Market',      t.marketName],
                ['Instrument',  t.instrumentName + (t.bulletinId ? ` (bulletin ${t.bulletinId})` : '')],
                ['Price',       price(t.price)],
                ['Quantity',    quantity(t.quantity)],
                ['Buyer',       side(t.buyFirm,  t.buyUser,  t.buyClientAccount)],
                ['Seller',      side(t.sellFirm, t.sellUser, t.sellClientAccount)]
            ]);
            const canReverse = !t.reversalOf && !t.reversedBy;
            const text = document.getElementById('reverse-text');
            if (t.reversalOf) {
                text.textContent = `This trade is the reversal of trade ${t.reversalOf}; a reversal can not be reversed.`;
            } else if (t.reversedBy) {
                text.textContent = `This trade is already reversed by trade ${t.reversedBy}.`;
            } else {
                text.textContent = `Create a reversal trade as market supervision: ${t.sellFirm} buys ${what} ` +
                    `from ${t.buyFirm}, with the same client accounts, so both firms' positions are restored. ` +
                    `Both firms are told of the trade; the market's prices and volume are not changed.`;
            }
            document.getElementById('reverse-title').textContent = canReverse ? 'Reverse Trade' : 'Trade';
            document.getElementById('reverse-button').style.display = canReverse ? '' : 'none';
            document.getElementById('reverse-button').disabled = false;
            document.getElementById('reverse-cancel').textContent = canReverse ? 'Cancel' : 'Close';
            document.getElementById('reverse-modal').style.display = 'flex';
        }

        function closeReverseModal() {
            document.getElementById('reverse-modal').style.display = 'none';
            selected = null;
        }

        async function confirmReverse() {
            if (!selected) return;
            const t = selected;
            document.getElementById('reverse-button').disabled = true;
            const r = t.bulletinId
                ? await cdApi.request(`../api/admin/bulletin-trades/${encodeURIComponent(t.tradeNo)}/reverse`,
                                      cdApi.json('POST', { tradeTime: t.tradeTime }))
                : await cdApi.request(`../api/admin/trades/${encodeURIComponent(t.tradeNo)}/reverse`,
                                      cdApi.json('POST', { instrumentId: t.instrumentId, tradeTime: t.tradeTime }));
            closeReverseModal();
            if (r.status === 401) { window.location.href = 'login.html'; return; }
            if (r.ok) showMessage(`Trade ${t.tradeNo} reversed by trade ${r.data.tradeNo}: ${r.data.buyFirm} bought ` +
                                  `${quantity(r.data.quantity)} ${t.instrumentName} @ ${price(r.data.price)} from ${r.data.sellFirm}.`, false);
            else      showMessage('Failed to reverse the trade: ' + r.error, true);
            loadTrades();
        }

        // ── Export ───────────────────────────────────────────────────────
        // The trades listed (with the filters applied) are written to a file as JSON or XML, prices and
        // quantities in display units. Where the browser has the File System Access API (Chrome, Edge; https
        // or localhost) Save opens the system's save dialog, where the folder and name are chosen; elsewhere
        // the file is downloaded with the given name into the browser's download folder.
        let exportFilter = null;   // the filter the listed trades were loaded with

        function openExportModal() {
            if (trades.length === 0) { showMessage('There are no trades to export.', true); return; }
            const f = exportFilter;
            document.getElementById('export-what').textContent =
                `${trades.length} trade${trades.length === 1 ? '' : 's'} on ${f.date}, ${f.marketName}, ${f.firm || 'all firms'}.`;
            const market = f.marketId === '0' ? (f.kind === 'b' ? 'all-bulletin' : 'all') : f.marketName.replace(/[^A-Za-z0-9_-]+/g, '_');
            document.getElementById('export-name').value = `trades-${f.date}-${market}` + (f.firm ? '-' + f.firm.replace(/[^A-Za-z0-9_-]+/g, '_') : '');
            formatChanged();
            document.getElementById('export-hint').textContent = window.showSaveFilePicker
                ? 'Save opens a dialog where you choose the folder, and can still change the name.'
                : 'This browser saves the file in its download folder (or asks where, depending on its settings).';
            document.getElementById('export-button').disabled = false;
            document.getElementById('export-modal').style.display = 'flex';
        }

        function closeExportModal() { document.getElementById('export-modal').style.display = 'none'; }

        // Keeps the file name's extension in step with the format
        function formatChanged() {
            const ext = document.getElementById('export-format').value;
            const el = document.getElementById('export-name');
            el.value = el.value.trim().replace(/\.(json|xml)$/i, '') + '.' + ext;
        }

        async function exportTrades() {
            const format = document.getElementById('export-format').value;
            let name = document.getElementById('export-name').value.trim();
            if (!name) { name = 'trades.' + format; }
            if (!name.toLowerCase().endsWith('.' + format)) name += '.' + format;
            const records = trades.map(exportRecord);
            const text = format === 'json' ? toJson(records) : toXml(records);
            const type = format === 'json' ? 'application/json' : 'application/xml';
            document.getElementById('export-button').disabled = true;
            try {
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({ suggestedName: name,
                        types: [{ description: format.toUpperCase() + ' file', accept: { [type]: ['.' + format] } }] });
                    const out = await handle.createWritable();
                    await out.write(new Blob([text], { type }));
                    await out.close();
                    name = handle.name;
                } else {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([text], { type }));
                    a.download = name;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
                }
                closeExportModal();
                showMessage(`${records.length} trade${records.length === 1 ? '' : 's'} exported to ${name}.`, false);
            } catch (e) {
                document.getElementById('export-button').disabled = false;
                if (e.name === 'AbortError') return;   // the save dialog was cancelled
                closeExportModal();
                showMessage('Export failed: ' + (e.message || e), true);
            }
        }

        // One trade as exported: display units, the time as local date and time with milliseconds
        function exportRecord(t) {
            const d = new Date(t.tradeTime);
            const r = {
                tradeNo: t.tradeNo,
                tradeTime: d.toLocaleDateString('sv-SE') + ' ' + d.toLocaleTimeString('sv-SE') + '.' + String(d.getMilliseconds()).padStart(3, '0'),
                marketId: t.marketId, market: t.marketName,
                instrumentId: t.instrumentId, bulletinId: t.bulletinId, instrument: t.instrumentName,
                price: t.price / SCALE, quantity: t.quantity / SCALE,
                buyer:  { firm: t.buyFirm,  trader: t.buyUser,  clientAccount: t.buyClientAccount,  userRef: t.buyUserRef,  orderId: t.buyOrderId },
                seller: { firm: t.sellFirm, trader: t.sellUser, clientAccount: t.sellClientAccount, userRef: t.sellUserRef, orderId: t.sellOrderId }
            };
            if (t.reversalOf) r.reversalOf = t.reversalOf;
            if (t.reversedBy) r.reversedBy = t.reversedBy;
            return r;
        }

        function exportHeader() {
            const f = exportFilter;
            return { exported: new Date().toISOString(), date: f.date,
                     market: f.marketId === '0' ? (f.kind === 'b' ? 'ALL BULLETIN MARKETS' : 'ALL') : f.marketName,
                     firm: f.firm || 'ALL', kind: f.kind === 'b' ? 'bulletin' : 'orderbook' };
        }

        function toJson(records) {
            return JSON.stringify(Object.assign(exportHeader(), { count: records.length, trades: records }), null, 2) + '\n';
        }

        function toXml(records) {
            const x = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            const el = (name, v, ind) => v == null ? '' : `${ind}<${name}>${x(v)}</${name}>\n`;
            const side = (name, s) => `    <${name}>\n` + Object.entries(s).map(([k, v]) => el(k, v, '      ')).join('') + `    </${name}>\n`;
            const h = exportHeader();
            let out = '<?xml version="1.0" encoding="UTF-8"?>\n'
                + `<trades kind="${x(h.kind)}" exported="${x(h.exported)}" date="${x(h.date)}" market="${x(h.market)}" firm="${x(h.firm)}" count="${records.length}">\n`;
            for (const r of records) {
                out += `  <trade tradeNo="${x(r.tradeNo)}">\n`;
                for (const k of ['tradeTime', 'marketId', 'market', 'instrumentId', 'bulletinId', 'instrument', 'price', 'quantity']) out += el(k, r[k], '    ');
                out += side('buyer', r.buyer) + side('seller', r.seller);
                out += el('reversalOf', r.reversalOf, '    ') + el('reversedBy', r.reversedBy, '    ');
                out += '  </trade>\n';
            }
            return out + '</trades>\n';
        }

        // ── Helpers ──────────────────────────────────────────────────────

        function side(firm, user, account) {
            return firm + (user ? ` / ${user}` : '') + (account ? `, account ${account}` : '');
        }

        function rows(pairs) {
            return pairs.map(([k, v]) => `<tr><td>${escHtml(k)}</td><td>${escHtml(v == null ? '' : String(v))}</td></tr>`).join('');
        }

        function showMessage(text, isError) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
        }

        function setInfo(text) { document.getElementById('info').textContent = text; }

        function today()      { return new Date().toLocaleDateString('sv-SE'); }
        function price(v)    { return v == null ? '' : (v / SCALE).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 5 }); }
        function quantity(v) { return v == null ? '' : (v / SCALE).toLocaleString('en-GB', { maximumFractionDigits: 5 }); }
        function time(ms)     { return new Date(ms).toLocaleTimeString('en-GB'); }
        function dateTime(ms) { const d = new Date(ms); return d.toLocaleDateString('sv-SE') + ' ' + d.toLocaleTimeString('en-GB'); }

        function escHtml(s) {
            return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        init();
    </script>
</body>
</html>
