<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporia &mdash; Change Password</title>
    <link rel="stylesheet" href="/admin/css/cd.css">
</head>
<body>
    <header class="cd-header">
        <span class="logo">EMPORIA</span>
        <span class="subtitle">Administration</span>
        <div class="spacer"></div>
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-ghost btn-sm" onclick="cdSession.logout()" style="margin-left:14px;">
            Logout
        </button>
    </header>

    <div class="cd-layout">
        <nav class="cd-sidebar"></nav>

        <main class="cd-content">
            <div class="page-title-row">
                <h2>Change Admin Password</h2>
            </div>

            <div class="card" style="max-width:460px;">
                <div id="error-msg" class="alert alert-error alert-hidden"></div>
                <div id="success-msg" class="alert alert-hidden" style="background:var(--success,#27ae60);color:#fff;padding:10px 14px;border-radius:4px;margin-bottom:14px;"></div>
                <form id="pw-form" onsubmit="changePassword(event)">
                    <div class="form-group">
                        <label for="f-current">Current Password <span style="color:var(--error)">*</span></label>
                        <input type="password" id="f-current" placeholder="Current password" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="f-new">New Password <span style="color:var(--error)">*</span></label>
                        <input type="password" id="f-new" placeholder="New password" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="f-confirm">Confirm New Password <span style="color:var(--error)">*</span></label>
                        <input type="password" id="f-confirm" placeholder="Repeat new password" required autocomplete="new-password">
                    </div>
                    <div style="display:flex;gap:10px;margin-top:8px;">
                        <button type="submit" class="btn btn-primary">Change Password</button>
                        <a href="/admin/admin.html" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/admin/js/cd-session.js"></script>
    <script src="/admin/js/cd-api.js"></script>
    <script src="/admin/js/cd-nav.js"></script>
    <script>
        cdNav.render('change-password');
        cdSession.guard('user-info');

        async function changePassword(event) {
            event.preventDefault();
            const errorMsg   = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            errorMsg.classList.add('alert-hidden');
            successMsg.classList.add('alert-hidden');

            const current = document.getElementById('f-current').value;
            const newPw   = document.getElementById('f-new').value;
            const confirm = document.getElementById('f-confirm').value;

            if (newPw !== confirm) {
                errorMsg.textContent = 'New password and confirmation do not match.';
                errorMsg.classList.remove('alert-hidden');
                return;
            }

            const r = await cdApi.request('/api/admin/password', cdApi.json('POST', { currentPassword: current, newPassword: newPw }));
            if (!r.ok) {
                errorMsg.textContent = 'Failed to change password: ' + r.error;
                errorMsg.classList.remove('alert-hidden');
                return;
            }
            document.getElementById('pw-form').reset();
            successMsg.textContent = 'Password changed successfully.';
            successMsg.classList.remove('alert-hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('f-current').focus();
        });
    </script>
</body>
</html>
